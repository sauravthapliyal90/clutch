services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env.production

    environment:
      NODE_ENV: production
      PORT: 5000

    expose:
      - "5000"

    restart: unless-stopped

    depends_on:
      - redis


  redis:
    image: redis:7-alpine

    restart: unless-stopped

    expose:
      - "6379"

    volumes:
      - redis_data:/data


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "80:80"

    restart: unless-stopped

    depends_on:
      - backend


volumes:
  redis_data: